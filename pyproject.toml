[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vexpay"
version = "0.1.1"
description = "Official Python SDK for the VEXPay API — Venezuelan payments (Pago Móvil C2P, cards, débito inmediato), payouts, checkout sessions, and signed webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "VEXPay" }]
keywords = ["vexpay", "venezuela", "payments", "pago movil", "c2p", "bolivares", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
  "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/chuventures/vexpay-python"
Issues = "https://github.com/chuventures/vexpay-python/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vexpay"]

[tool.hatch.build.targets.sdist]
include = ["src/vexpay", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src/vexpay"]
plugins = ["pydantic.mypy"]
